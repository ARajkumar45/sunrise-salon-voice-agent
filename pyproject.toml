[project]
name = "sunrise-salon-voice-agent"
version = "0.1.0"
description = "Voice receptionist for appointment-based businesses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[groq,silero]~=1.8",
    "livekit-api",
    "fastapi",
    "uvicorn",
    "psycopg[binary,pool]",
    "pyyaml",
    "aiohttp",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["llm: simulated conversations that call the Groq API (use free-tier tokens)"]
