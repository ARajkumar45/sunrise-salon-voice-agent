<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business details</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #faf7f2; color: #222; margin: 0; padding: 20px; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 1.4rem; }
    textarea { width: 100%; height: 62vh; font: 14px/1.5 ui-monospace, Menlo, monospace; padding: 12px;
               border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { font-size: 1rem; padding: 10px 28px; border: 0; border-radius: 8px; background: #1f8a4c; color: #fff; cursor: pointer; }
    #result { margin-left: 14px; }
    .ok { color: #1f8a4c; } .bad { color: #c0392b; }
    nav a { margin-right: 16px; }
    p.help { color: #555; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Business details</h1>
  <nav><a id="calls">Recent calls</a><a id="messages">Messages for staff</a><a id="latency">Speed report</a><a id="callpage">Open the call page</a></nav>
  <p class="help">Change a price, an opening time, a service or an answer below, then press Save.
    Keep the layout (the dashes and the spacing at the start of lines). The next call uses the new details.</p>
  <textarea id="data" spellcheck="false">Loading...</textarea>
  <p><button id="save">Save</button><span id="result"></span></p>
</main>
<script>
  const business = location.pathname.split("/").pop();
  const key = new URLSearchParams(location.search).get("key") || "";
  const withKey = (path) => "/admin/" + business + path + "?key=" + encodeURIComponent(key);
  const box = document.getElementById("data"), result = document.getElementById("result");
  document.getElementById("title").textContent = "Business details: " + business;
  document.getElementById("calls").href = withKey("/calls");
  document.getElementById("messages").href = withKey("/messages");
  document.getElementById("latency").href = withKey("/latency");
  document.getElementById("callpage").href = "/call/" + business;

  fetch(withKey("/data")).then(async (r) => { box.value = r.ok ? await r.text() : "Could not load: " + (await r.text()); });

  document.getElementById("save").addEventListener("click", async () => {
    result.textContent = "Saving...";
    const response = await fetch(withKey("/data"), { method: "POST", body: box.value });
    const text = await response.text();
    result.className = response.ok ? "ok" : "bad";
    try { result.textContent = response.ok ? text : JSON.parse(text).detail; } catch { result.textContent = text; }
  });
</script>
</body>
</html>
