<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Call us</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #faf7f2; color: #222; margin: 0;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    main { text-align: center; padding: 24px; max-width: 420px; }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    p { color: #555; }
    button { font-size: 1.2rem; padding: 16px 44px; border: 0; border-radius: 999px;
             background: #1f8a4c; color: #fff; cursor: pointer; margin-top: 16px; }
    button.live { background: #c0392b; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 18px; min-height: 1.5em; }
    #timing { margin-top: 8px; font-size: .8rem; color: #888; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Voice receptionist</h1>
  <p>Press Call to talk to our voice receptionist. Allow the microphone when your browser asks.</p>
  <button id="call">Call</button>
  <div id="status"></div>
  <div id="timing"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.25.0/dist/livekit-client.umd.min.js"></script>
<script>
  const { Room, RoomEvent, Track } = LivekitClient;
  const business = location.pathname.split("/").pop();   // /call/sunrise-salon -> sunrise-salon
  const button = document.getElementById("call");
  const statusBox = document.getElementById("status");
  const timingBox = document.getElementById("timing");
  let room = null;

  const setStatus = (text) => { statusBox.textContent = text; };

  // Show the business name. An unknown business gets a clear message and no Call button.
  fetch("/api/business/" + encodeURIComponent(business)).then(async (response) => {
    if (!response.ok) { button.hidden = true; setStatus("This call page does not exist."); return; }
    const { name } = await response.json();
    document.getElementById("title").textContent = name;
    document.title = "Call " + name;
  });

  async function startCall() {
    const pressedAt = performance.now();
    button.disabled = true;
    setStatus("Connecting...");
    try {
      const response = await fetch("/api/token?business=" + encodeURIComponent(business));
      if (!response.ok) throw new Error("no token: " + response.status);
      const { url, token } = await response.json();

      room = new Room();
      // When the agent's voice arrives, play it.
      room.on(RoomEvent.TrackSubscribed, (track) => {
        if (track.kind !== Track.Kind.Audio) return;
        const audio = track.attach();
        document.body.appendChild(audio);
        audio.addEventListener("playing", () => {
          const seconds = ((performance.now() - pressedAt) / 1000).toFixed(1);
          timingBox.textContent += " · agent audio after " + seconds + " s";
        }, { once: true });
        setStatus("Connected. Go ahead and talk.");
      });
      room.on(RoomEvent.Disconnected, endCall);

      await room.connect(url, token);
      timingBox.textContent = "connected in " + ((performance.now() - pressedAt) / 1000).toFixed(1) + " s";
      // Browser echo cancellation stops the agent from hearing (and interrupting) itself.
      await room.localParticipant.setMicrophoneEnabled(true, {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true,
      });
      // The agent's audio may already have arrived while the microphone was being set up.
      if (!statusBox.textContent.startsWith("Connected")) setStatus("Waiting for the receptionist...");
      button.textContent = "Hang up";
      button.classList.add("live");
    } catch (error) {
      setStatus("Could not start the call: " + error.message);
      endCall();
    }
    button.disabled = false;
  }

  function endCall() {
    if (room) { room.disconnect(); room = null; }
    document.querySelectorAll("audio").forEach((el) => el.remove());
    button.textContent = "Call";
    button.classList.remove("live");
    button.disabled = false;
    if (statusBox.textContent.startsWith("Connected") || statusBox.textContent.startsWith("Waiting")) {
      setStatus("Call ended.");
    }
  }

  button.addEventListener("click", () => (room ? endCall() : startCall()));
</script>
</body>
</html>
