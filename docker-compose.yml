# Everything runs with:  docker compose up --build
# Then open https://localhost (or http://localhost:8000) and press Call.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  tts:
    build:
      context: .
      dockerfile: docker/piper.Dockerfile
    restart: unless-stopped

  web:
    build:
      context: .
      target: app
    command: uvicorn app.web:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      target: app
    command: python -m app.agent start
    env_file: .env
    environment:
      PIPER_URL: http://tts:5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      web:            # web creates the tables and loads the business data on startup
        condition: service_healthy
      tts:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

  # Automated tests. They use their own throwaway database (receptionist_test).
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
